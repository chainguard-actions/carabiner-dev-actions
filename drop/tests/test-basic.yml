name: Test basic binary download
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create download directory
        run: mkdir -p "$GITHUB_WORKSPACE/.carabiner-test"
      - id: action
        uses: .
        with:
          binary: sigstore/cosign
          directory: /github/workspace/.carabiner-test
          insecure: 'true'
        continue-on-error: true
      - name: Assert binary was downloaded or action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded, checking for downloaded binary..."
            if ls "$GITHUB_WORKSPACE/.carabiner-test/" 2>/dev/null | grep -q .; then
              echo "PASS: files found in download directory"
              ls -la "$GITHUB_WORKSPACE/.carabiner-test/"
            else
              echo "FAIL: action succeeded but no files found in download directory"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed gracefully (network/policy issue expected in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
