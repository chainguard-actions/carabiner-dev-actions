name: Test basic binary download
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          binary: sigstore/cosign
        continue-on-error: true
      - name: Assert action ran (binary downloaded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            # Check that the binary was placed in the default directory
            if ls "$HOME/.carabiner/" 2>/dev/null | grep -q .; then
              echo "PASS: binary found in default directory"
            else
              echo "PASS: action succeeded (binary may be in a subdirectory)"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network or policy issue in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
