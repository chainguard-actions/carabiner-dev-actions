name: Test custom download directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"
      - name: Prepare custom download directory
        run: mkdir -p "$GITHUB_WORKSPACE/custom-bin"
      - id: action
        uses: .
        with:
          binary: sigstore/cosign
          directory: /github/workspace/custom-bin
        continue-on-error: true
      - name: Assert custom directory was used
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded, verifying files landed in custom directory..."
            if ls "$GITHUB_WORKSPACE/custom-bin/" 2>/dev/null | grep -q .; then
              echo "PASS: binary files found in custom directory"
              ls -la "$GITHUB_WORKSPACE/custom-bin/"
            else
              echo "FAIL: action succeeded but no files found in custom directory $GITHUB_WORKSPACE/custom-bin/"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (may have failed due to network/policy constraints in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
