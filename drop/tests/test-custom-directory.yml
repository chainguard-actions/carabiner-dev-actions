name: Test custom directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          binary: sigstore/cosign
          insecure: 'true'
          directory: /github/workspace/custom-tools

      - name: Assert custom directory was created and populated
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Listing $GITHUB_WORKSPACE/custom-tools:"
            ls -la "$GITHUB_WORKSPACE/custom-tools" || true
            if [ ! -d "$GITHUB_WORKSPACE/custom-tools" ]; then
              echo "FAIL: custom directory $GITHUB_WORKSPACE/custom-tools was not created"
              exit 1
            fi
            COUNT=$(ls "$GITHUB_WORKSPACE/custom-tools" | wc -l)
            echo "Files in custom-tools: $COUNT"
            if [ "$COUNT" -eq 0 ]; then
              echo "FAIL: no files were downloaded to $GITHUB_WORKSPACE/custom-tools"
              exit 1
            fi
            echo "PASS: binary downloaded to custom directory successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/policy issue in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
