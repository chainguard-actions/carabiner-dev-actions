name: Test insecure binary download
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          binary: sigstore/cosign
          insecure: 'true'
          directory: /github/workspace/bin-insecure
      - name: Assert binary was downloaded in insecure mode or action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "Listing workspace:"
          ls -la "$GITHUB_WORKSPACE/" || true
          echo "Listing bin-insecure directory (if exists):"
          ls -la "$GITHUB_WORKSPACE/bin-insecure" || true
          if [ "$OUTCOME" = "success" ]; then
            if [ ! -d "$GITHUB_WORKSPACE/bin-insecure" ]; then
              echo "FAIL: action succeeded but download directory does not exist"
              exit 1
            fi
            COUNT=$(find "$GITHUB_WORKSPACE/bin-insecure" -maxdepth 3 -type f | wc -l)
            echo "Files found: $COUNT"
            if [ "$COUNT" -lt 1 ]; then
              echo "FAIL: action succeeded but no binary files found in download directory"
              exit 1
            fi
            echo "PASS: binary downloaded successfully in insecure mode"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/policy issue in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
