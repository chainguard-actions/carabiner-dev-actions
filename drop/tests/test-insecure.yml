name: Test insecure mode download
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          binary: sigstore/cosign
          insecure: 'true'
          directory: /github/workspace/bin-insecure

      - name: Assert binary directory was created and contains files
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Listing $GITHUB_WORKSPACE/bin-insecure:"
            ls -la "$GITHUB_WORKSPACE/bin-insecure" || true
            if [ ! -d "$GITHUB_WORKSPACE/bin-insecure" ]; then
              echo "FAIL: directory $GITHUB_WORKSPACE/bin-insecure was not created"
              exit 1
            fi
            COUNT=$(ls "$GITHUB_WORKSPACE/bin-insecure" | wc -l)
            echo "Files in bin-insecure: $COUNT"
            if [ "$COUNT" -eq 0 ]; then
              echo "FAIL: no files were downloaded to $GITHUB_WORKSPACE/bin-insecure"
              exit 1
            fi
            echo "PASS: binary downloaded in insecure mode successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/policy issue in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
