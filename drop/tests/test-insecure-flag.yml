name: Test insecure flag input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create download directory
        run: mkdir -p "$GITHUB_WORKSPACE/bin-insecure"
      - id: action
        uses: .
        with:
          binary: sigstore/cosign
          directory: ${{ github.workspace }}/bin-insecure
          insecure: 'false'
        continue-on-error: true
      - name: Assert action ran with insecure=false
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With insecure=false, the action attempts to apply security policies.
          # In the test environment this may succeed or fail depending on network/policy availability.
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded with insecure=false"
            if ls "$GITHUB_WORKSPACE/bin-insecure/" 2>/dev/null | grep -q .; then
              echo "PASS: binary files found in output directory"
              ls -la "$GITHUB_WORKSPACE/bin-insecure/"
            else
              echo "FAIL: action succeeded but no files found in output directory"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with insecure=false (may fail in test environment due to policy/network constraints)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
