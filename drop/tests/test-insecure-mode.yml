name: Test insecure mode download
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create target directory
        run: mkdir -p "$GITHUB_WORKSPACE/bin-insecure"
      - id: action
        uses: .
        with:
          binary: sigstore/cosign
          directory: /github/workspace/bin-insecure
          insecure: 'true'
        continue-on-error: true
      - name: Assert action ran in insecure mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded in insecure mode"
            ls -la "$GITHUB_WORKSPACE/bin-insecure/" 2>/dev/null || true
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network or policy issue in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
