name: Test insecure mode input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create download directory
        run: mkdir -p "$GITHUB_WORKSPACE/.carabiner-insecure"
      - id: action
        uses: .
        with:
          binary: sigstore/cosign
          directory: /github/workspace/.carabiner-insecure
          insecure: 'false'
        continue-on-error: true
      - name: Assert action ran with insecure=false
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded with insecure=false"
            if ls "$GITHUB_WORKSPACE/.carabiner-insecure/" 2>/dev/null | grep -q .; then
              echo "PASS: files found in download directory"
              ls -la "$GITHUB_WORKSPACE/.carabiner-insecure/"
            else
              echo "FAIL: action succeeded but no files found in download directory"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed gracefully (policy enforcement or network issue expected in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
