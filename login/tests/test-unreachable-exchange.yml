name: Test unreachable exchange server
# Tests that the action fails gracefully when the token exchange server is unreachable.
# We point exchange-url at a localhost address that nothing is listening on.
# The action will first try to get an OIDC token; if OIDC is available it will
# then fail at the exchange step. If OIDC is not available it fails at the OIDC step.
# Either way the action must fail (not hang or panic).
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run carabiner login with unreachable exchange server
        uses: .
        continue-on-error: true
        with:
          exchange-url: "http://127.0.0.1:19999"
          audience: "https://api.carabiner.dev"
          scope: "attestations:read"

      - name: Assert action failed gracefully (unreachable server)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully when exchange server is unreachable"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should not succeed with an unreachable exchange server"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
