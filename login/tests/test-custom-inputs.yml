name: Test custom inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: login
        uses: .
        continue-on-error: true
        with:
          exchange-url: "https://auth.carabiner.dev"
          audience: "https://api.carabiner.dev"
          scope: "attestations:read"
          resource: ""

      - name: Assert action ran with custom inputs and produced outputs or failed gracefully
        env:
          OUTCOME: ${{ steps.login.outcome }}
          EXPIRES_IN: ${{ steps.login.outputs.expires-in }}
          SCOPE: ${{ steps.login.outputs.scope }}
        run: |
          echo "outcome: $OUTCOME"
          echo "expires-in: $EXPIRES_IN"
          echo "scope: $SCOPE"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$EXPIRES_IN" ]; then
              echo "FAIL: action succeeded but expires-in output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with custom inputs, expires-in='$EXPIRES_IN' scope='$SCOPE'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully with custom inputs (exchange server rejected, expected in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

  test-empty-scope:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: login-empty-scope
        uses: .
        continue-on-error: true
        with:
          exchange-url: "https://auth.carabiner.dev"
          audience: "https://api.carabiner.dev"
          scope: ""

      - name: Assert action ran with empty scope and produced outputs or failed gracefully
        env:
          OUTCOME: ${{ steps.login-empty-scope.outcome }}
          EXPIRES_IN: ${{ steps.login-empty-scope.outputs.expires-in }}
        run: |
          echo "outcome: $OUTCOME"
          echo "expires-in: $EXPIRES_IN"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$EXPIRES_IN" ]; then
              echo "FAIL: action succeeded but expires-in output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with empty scope (identity-only token), expires-in='$EXPIRES_IN'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully with empty scope (exchange server rejected, expected in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
