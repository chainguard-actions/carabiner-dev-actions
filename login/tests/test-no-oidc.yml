name: Test no OIDC token available
# Tests that the action fails gracefully with a clear error when OIDC is not available.
# The job intentionally does NOT grant id-token: write, so ACTIONS_ID_TOKEN_REQUEST_URL
# and ACTIONS_ID_TOKEN_REQUEST_TOKEN will be unset, triggering the early-exit guard.
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    # Deliberately NO permissions block — OIDC is not granted
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run carabiner login (expect failure — no OIDC)
        uses: .
        continue-on-error: true
        env:
          # Explicitly unset OIDC vars to ensure the guard fires even if the
          # runner happens to inject them under act.
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""

      - name: Assert action failed gracefully (no OIDC)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when OIDC is unavailable"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should not succeed without OIDC credentials"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
