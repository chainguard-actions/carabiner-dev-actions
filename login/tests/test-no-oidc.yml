name: Test no OIDC token available
# Tests that the action fails with a clear error when OIDC is not available.
# The action requires id-token: write; without it, ACTIONS_ID_TOKEN_REQUEST_URL
# and ACTIONS_ID_TOKEN_REQUEST_TOKEN are unset and the action must exit with
# a descriptive error.
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    # Deliberately do NOT grant id-token: write so OIDC vars are absent.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          # Explicitly unset OIDC vars to simulate missing permission
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""

      - name: Assert action failed due to missing OIDC token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when OIDC is unavailable, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when OIDC token was not available"
