name: Test with resource URI
# Tests the action with a resource URI specified. This exercises the resource_args
# loop that builds --data-urlencode resource= parameters for the exchange request.
# The exchange server will refuse the sentinel repo, but the action must fail gracefully.
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run carabiner login with a resource URI
        uses: .
        continue-on-error: true
        with:
          exchange-url: "https://auth.carabiner.dev"
          audience: "https://api.carabiner.dev"
          scope: "attestations:read"
          resource: "organization://example-org"

      - name: Assert action outcome is success or graceful failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXPIRES_IN: ${{ steps.action.outputs.expires-in }}
          SCOPE: ${{ steps.action.outputs.scope }}
        run: |
          echo "outcome:    $OUTCOME"
          echo "expires-in: $EXPIRES_IN"
          echo "scope:      $SCOPE"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$EXPIRES_IN" ]; then
              echo "FAIL: action succeeded but expires-in output is empty"
              exit 1
            fi
            echo "PASS: login with resource succeeded, token valid for ${EXPIRES_IN}s, scope='$SCOPE'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo not registered or resource not in org)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
