name: Test empty scope (identity-only token)
# Tests the action with scope set to empty string, which requests an identity-only
# token (no capability scopes). The action omits the scope parameter from the
# exchange request in this case. The exchange server will still refuse the sentinel
# repo, but the action must fail gracefully — not crash.
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run carabiner login with empty scope
        uses: .
        continue-on-error: true
        with:
          exchange-url: "https://auth.carabiner.dev"
          audience: "https://api.carabiner.dev"
          scope: ""
          resource: ""

      - name: Assert action outcome is success or graceful failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXPIRES_IN: ${{ steps.action.outputs.expires-in }}
          SCOPE: ${{ steps.action.outputs.scope }}
        run: |
          echo "outcome:    $OUTCOME"
          echo "expires-in: $EXPIRES_IN"
          echo "scope:      $SCOPE"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$EXPIRES_IN" ]; then
              echo "FAIL: action succeeded but expires-in output is empty"
              exit 1
            fi
            echo "PASS: identity-only login succeeded, token valid for ${EXPIRES_IN}s"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo not registered with carabiner)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
