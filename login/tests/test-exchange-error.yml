name: Test exchange server error response handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up mock curl that simulates exchange server rejection
        run: |
          mkdir -p /tmp/mock-carabiner-err

          SCRIPT=/tmp/mock-carabiner-err/curl
          printf '%s\n' '#!/bin/sh' > "$SCRIPT"
          printf '%s\n' '# Fake curl: returns OIDC token but simulates exchange server 403 rejection' >> "$SCRIPT"
          printf '%s\n' 'out=""' >> "$SCRIPT"
          printf '%s\n' 'prev=""' >> "$SCRIPT"
          printf '%s\n' 'for arg in "$@"; do' >> "$SCRIPT"
          printf '%s\n' '  case "$prev" in' >> "$SCRIPT"
          printf '%s\n' '    -o|--output) out="$arg" ;;' >> "$SCRIPT"
          printf '%s\n' '  esac' >> "$SCRIPT"
          printf '%s\n' '  prev="$arg"' >> "$SCRIPT"
          printf '%s\n' 'done' >> "$SCRIPT"
          printf '%s\n' 'serve_text() {' >> "$SCRIPT"
          printf '%s\n' '  local text="$1"' >> "$SCRIPT"
          printf '%s\n' '  if [ -n "$out" ]; then' >> "$SCRIPT"
          printf '%s\n' '    printf "%s" "$text" > "$out"' >> "$SCRIPT"
          printf '%s\n' '  else' >> "$SCRIPT"
          printf '%s\n' '    printf "%s" "$text"' >> "$SCRIPT"
          printf '%s\n' '  fi' >> "$SCRIPT"
          printf '%s\n' '}' >> "$SCRIPT"
          printf '%s\n' 'case "$*" in' >> "$SCRIPT"
          printf '%s\n' '  *audience*|*ACTIONS_ID_TOKEN*|*token.actions*)' >> "$SCRIPT"
          printf '%s\n' '    serve_text '"'"'{"value":"eyJhbGciOiJSUzI1NiJ9.eyJzdWIiOiJyZXBvOnRlc3QifQ.fakesig"}'"'"'' >> "$SCRIPT"
          printf '%s\n' '    exit 0' >> "$SCRIPT"
          printf '%s\n' '    ;;' >> "$SCRIPT"
          printf '%s\n' '  */token*)' >> "$SCRIPT"
          printf '%s\n' '    # Exchange server returns 403 invalid_scope' >> "$SCRIPT"
          printf '%s\n' '    serve_text '"'"'{"error":"invalid_scope","error_description":"None of the requested scopes are granted to this repository"}'"'"'' >> "$SCRIPT"
          printf '%s\n' '    if [ -n "$out" ]; then' >> "$SCRIPT"
          printf '%s\n' '      printf "\n403" >> "$out"' >> "$SCRIPT"
          printf '%s\n' '    else' >> "$SCRIPT"
          printf '%s\n' '      printf "\n403"' >> "$SCRIPT"
          printf '%s\n' '    fi' >> "$SCRIPT"
          printf '%s\n' '    exit 0' >> "$SCRIPT"
          printf '%s\n' '    ;;' >> "$SCRIPT"
          printf '%s\n' '  *)' >> "$SCRIPT"
          printf '%s\n' '    exec /usr/bin/curl "$@"' >> "$SCRIPT"
          printf '%s\n' '    ;;' >> "$SCRIPT"
          printf '%s\n' 'esac' >> "$SCRIPT"
          chmod +x "$SCRIPT"

      - id: action
        uses: .
        continue-on-error: true
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: "https://token.actions.githubusercontent.com/oidc/token"
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: "fake-runner-token"
          PATH: "/tmp/mock-carabiner-err:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
        with:
          exchange-url: "https://mock.carabiner.test/token"
          audience: "https://api.carabiner.dev"
          scope: "attestations:read attestations:write"

      - name: Assert action failed on exchange server rejection
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when exchange server rejected the token"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should not succeed when exchange server returns 403"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
