name: Test basic usage with OIDC token
# Tests the action with id-token: write granted so the OIDC token is available.
# The action will successfully acquire an OIDC token from the runner, then
# attempt to exchange it at auth.carabiner.dev. In the test harness the
# exchange will likely be refused (the repo is not enrolled in Carabiner),
# so we accept either a graceful failure at the exchange step or a success.
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          exchange-url: "https://auth.carabiner.dev"
          audience: "https://api.carabiner.dev"
          scope: "attestations:read attestations:write"

      - name: Assert action ran (OIDC acquired; exchange may be refused for test repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXPIRES_IN: ${{ steps.action.outputs.expires-in }}
          SCOPE: ${{ steps.action.outputs.scope }}
        run: |
          echo "outcome:    $OUTCOME"
          echo "expires-in: $EXPIRES_IN"
          echo "scope:      $SCOPE"
          if [ "$OUTCOME" = "success" ]; then
            # Token exchange succeeded — validate outputs are non-empty
            if [ -z "$EXPIRES_IN" ]; then
              echo "FAIL: action succeeded but expires-in output is empty"
              exit 1
            fi
            echo "PASS: logged in; token valid for ${EXPIRES_IN}s, scope='$SCOPE'"
          elif [ "$OUTCOME" = "failure" ]; then
            # Exchange was refused (repo not enrolled) — this is expected in CI
            echo "PASS: action failed gracefully (exchange server refused the test repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
