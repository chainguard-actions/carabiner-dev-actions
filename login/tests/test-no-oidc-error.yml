name: Test no-OIDC error handling
# Tests that the action fails gracefully with a clear error message
# when OIDC tokens are not available (no id-token: write permission).
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    # Intentionally NOT setting id-token: write — OIDC will be unavailable
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: login
        uses: .
        continue-on-error: true
        env:
          # Explicitly unset OIDC vars to ensure they are absent
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""

      - name: Assert action failed gracefully when OIDC is unavailable
        env:
          OUTCOME: ${{ steps.login.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when OIDC tokens are unavailable"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed without OIDC tokens"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
