name: Test no OIDC token error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    # Intentionally NOT granting id-token: write so OIDC is unavailable
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          # Explicitly unset OIDC vars to simulate no OIDC token
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        with:
          exchange-url: "https://auth.carabiner.dev"
          audience: "https://api.carabiner.dev"
          scope: "attestations:read attestations:write"
      - name: Assert action failed gracefully without OIDC token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when OIDC token is unavailable"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should not succeed without OIDC token"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
